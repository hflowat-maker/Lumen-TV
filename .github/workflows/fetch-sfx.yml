name: Fetch sound assets

on:
  push:
    branches: [sfx-fetch]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and publish
        shell: bash
        run: |
          mkdir out && cd out
          curl -sSL -o sfx1.mp3 "https://storage.googleapis.com/xi-backend/database/workspace/7afc8ebf983940f2987d767a2601eb0d/content_generation/vPF8dRohw40exh02jW16/WbnEe1Rat73GgeRpyuhJ/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261026%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261026T143021Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-"
          curl -sSL -o sfx2.mp3 "https://storage.googleapis.com/xi-backend/database/workspace/7afc8ebf983940f2987d767a2601eb0d/content_generation/hK406JdjWvr4Of6ewxWL/daoPZHK6hbb0QOq1PCnf/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261026%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261026T143022Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-"
          curl -sSL -o sfx3.mp3 "https://storage.googleapis.com/xi-backend/database/workspace/7afc8ebf983940f2987d767a2601eb0d/content_generation/vJRZLvX161VVPsyKTJik/YQIX4lVJQL7tQ86KOJJd/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261026%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261026T143022Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-"
          ls -la
          git init -q
          git config user.name "lumen-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b sfx-files
          git add -A
          git commit -q -m "Sons générés"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sfx-files
